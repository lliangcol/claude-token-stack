    <text x="24" y="126" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">rollback</text>
  </g>

  <text x="104" y="520" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="26">Local-first • cross-platform • benchmark-ready • rollback-ready</text>

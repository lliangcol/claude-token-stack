  </g>

  <path d="M430 355 H520" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <path d="M520 355 l-24 -18 v36 z" fill="#94a3b8"/>

  <g transform="translate(548 260)">
    <rect width="300" height="190" rx="18" fill="#172554" stroke="#3b82f6"/>
    <text x="28" y="48" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Warn-first hooks</text>
    <text x="28" y="88" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="24">bounded discovery</text>
    <text x="28" y="128" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">tune before blocking</text>
  </g>

  <path d="M874 355 H964" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>

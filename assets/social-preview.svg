  <text x="106" y="198" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="28">Claude Code context governance for real repositories</text>

  <g transform="translate(104 260)">
    <rect width="300" height="190" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="28" y="48" fill="#f8fafc" font-family="Consolas, monospace" font-size="25" font-weight="700">$ tree</text>
    <text x="28" y="88" fill="#fca5a5" font-family="Arial, Helvetica, sans-serif" font-size="24">Noisy repo read</text>

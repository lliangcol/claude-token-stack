<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Claude Token Stack social preview</title>
  <desc id="desc">Repo-level context governance for Claude Code with warn-first hooks, metrics reports, and rollback.</desc>
  <rect width="1280" height="640" fill="#0f172a"/>
  <rect x="64" y="64" width="1152" height="512" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/>
